<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#3ba3f6"><title>PHYSIKA — Fiko & Fisika Semester 3</title>

<style>

*{box-sizing:border-box}html{scroll-behavior:smooth}

.hero{position:relative;overflow:hidden;min-height:78vh;display:flex;align-items:center}

.hc{position:relative;z-index:3;padding:40px 0 110px;max-width:640px}

.g{display:grid;gap:18px}.cg{grid-template-columns:repeat(4,1fr)}

.nt{border-left:5px solid var(--o);background:#fff3ec;padding:12px 16px;border-radius:0 14px 14px 0;margin:12px 0}
.pg{height:10px;border-radius:9px;background:#dcedff;overflow:hidden;margin:10px 0}.pg span{display:block;height:100%;background:var(--o);border-radius:9px}
canvas{width:100%;height:auto;aspect-ratio:800/420;border-radius:20px;background:linear-gradient(#d9efff,#f4faff);display:block}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:16px}.ctl label{font-size:.85rem;display:grid;gap:4px}input[type=range]{width:100%;accent-color:var(--o)}
.lab{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;align-items:start}
.crumb{margin:22px 0 14px}.crumb a{cursor:pointer;text-decoration:underline}
.res{font:800 1.02rem/1.9 Poppins;background:#eef6ff;border-radius:16px;padding:14px 18px;margin:10px 0}
footer{background:var(--o);padding:22px;text-align:center;font-size:.85rem;margin-top:40px;border-top:6px solid var(--o2)}

@media(max-width:560px){.cg{grid-template-columns:1fr}.hc{max-width:100%;padding-bottom:230px}.fox{width:78vw;right:-10vw}}
</style></head><body>

const $=s=>document.querySelector(s),M=$('#main'),H=h=>M.innerHTML=h;let cur,ci=0,raf,pg='home';

<section class="sec w" id="courses"><h2>Pilih mata kuliah</h2><p class="sub">Tiap mata kuliah punya bab, rujukan buku, dan laboratorium simulasi.</p><div class="g cg">${C.map(c=>`<div class="card cc" style="--c:${c[3]}" onclick="course('${c[0]}')"><div class="ic">${c[2]}</div><h3>${c[1]}</h3><p>${c[4]}</p><small>${c[6].length} bab • Masuk →</small></div>`).join('')}</div></section>

to?$('#'+to).scrollIntoView({behavior:'smooth'}):scrollTo(0,0)}

const S={

return `ω = ${o.toFixed(2)} rad/s<br>T = ${(6.283/o).toFixed(2)} s<br>x = ${u.toFixed(1)} cm`}},
termo:{t:'Gas ideal dalam silinder',e:'Titik-titik adalah molekul gas. Naikkan suhu → molekul makin cepat dan warnanya makin merah. Perkecil volume → piston maju, molekul menumbuk dinding lebih sering sehingga tekanan naik (PV = nRT). Jumlah titik mengikuti jumlah mol.',c:[['n','Jumlah mol',.1,3,.1,1],['T','Suhu (K)',200,800,10,300],['V','Volume (L)',2,30,1,10]],
d(x,t,v,dt,s){if(!s.p){s.p=[];for(let i=0;i<45;i++)s.p.push({x:100+Math.random()*100,y:130+Math.random()*160,a:Math.random()*6.28})}
let xp=100+v.V*17,sp=Math.sqrt(v.T/300)*140,P=v.n*8.314*v.T/(v.V/1000),cnt=Math.round(v.n*15);
x.fillStyle='#fff';x.fillRect(90,110,xp-90,200);x.fillStyle='#12305a';x.fillRect(80,100,xp-70,12);x.fillRect(80,308,xp-70,12);x.fillRect(80,100,12,220);
x.fillStyle='#ff6b3d';x.fillRect(xp,104,22,212);x.fillRect(xp+22,205,780-xp,10);
s.p.slice(0,cnt).forEach(p=>{p.x+=Math.cos(p.a)*sp*dt;p.y+=Math.sin(p.a)*sp*dt;if(p.x<98){p.x=98;p.a=Math.PI-p.a}if(p.x>xp-8){p.x=xp-8;p.a=Math.PI-p.a}if(p.y<118){p.y=118;p.a=-p.a}if(p.y>302){p.y=302;p.a=-p.a}
x.fillStyle=`hsl(${200-(v.T-200)/3},90%,52%)`;x.beginPath();x.arc(p.x,p.y,7,0,7);x.fill()});
return `P = ${(P/1000).toFixed(1)} kPa<br>U = ${(1.5*v.n*8.314*v.T).toFixed(0)} J<br>Kelajuan visual ∝ √T`}},
bio:{t:'Aliran darah dalam pembuluh',e:'Sel darah merah mengalir dalam pembuluh. Kecepatan paling besar di tengah dan hampir nol di dinding (profil parabola, panah biru). Debit sebanding r⁴ (Poiseuille): pembuluh sedikit menyempit, aliran turun tajam. Kelajuan gambar dibatasi agar tetap terlihat.',c:[['r','Radius pembuluh (mm)',1,5,.25,2],['dp','Beda tekanan (kPa)',1,20,1,5],['eta','Viskositas (mPa·s)',1,8,.5,3]],
d(x,t,v,dt,s){if(!s.p){s.p=[];for(let i=0;i<34;i++)s.p.push({x:Math.random()*800,u:Math.random()*1.8-.9})}
let h=v.r*30,vm=Math.min(600,18*v.r*v.r*v.dp/v.eta),r=v.r/1000,Q=Math.PI*r**4*v.dp*1000/(8*v.eta/1000*.1);
x.fillStyle='#ff9db1';x.fillRect(0,210-h-20,800,20);x.fillRect(0,210+h,800,20);x.fillStyle='#ffe3e8';x.fillRect(0,210-h,800,2*h);
s.p.forEach(p=>{p.x=(p.x+vm*(1-p.u*p.u)*dt)%800;let y=210+p.u*h*.8;x.fillStyle='#e5324f';x.beginPath();x.ellipse(p.x,y,15,8,0,0,7);x.fill();x.fillStyle='#ff8da0';x.beginPath();x.ellipse(p.x,y,7,3,0,0,7);x.fill()});
x.strokeStyle='#12305a';x.lineWidth=4;for(let u=-.8;u<=.81;u+=.4){let y=210+u*h*.8;x.beginPath();x.moveTo(30,y);x.lineTo(30+(1-u*u)*Math.min(120,vm*.4),y);x.stroke()}
return `Q = ${(Q*1e9).toFixed(2)} µL/s<br>v rata-rata = ${(Q/(Math.PI*r*r)*1000).toFixed(2)} mm/s`}},
modern:{t:'Efek fotoelektrik',e:'Lampu di kiri memancarkan foton (warna = frekuensi). Jika energi foton hf lebih besar dari fungsi kerja logam, elektron (bola biru) terlepas. Frekuensi menentukan energi tiap elektron; intensitas hanya menambah jumlah foton dan elektron.',c:[['f','Frekuensi cahaya (10¹⁴ Hz)',3,12,.1,8],['w','Fungsi kerja logam (eV)',1,5,.1,2],['I','Intensitas',1,10,1,5]],
d(x,t,v,dt,s){if(!s.p){s.p=[];s.e=[];s.a=0}let E=4.1357e-15*v.f*1e14,K=E-v.w,hue=(v.f-3)/9*270;
s.a+=dt*v.I*1.5;while(s.a>1){s.a--;s.p.push({x:30,y:100+Math.random()*220})}
s.p=s.p.filter(p=>{p.x+=320*dt;if(p.x>=590){if(K>0)s.e.push({x:590,y:p.y,vx:-80-Math.sqrt(K)*140,vy:(Math.random()-.5)*50});return false}return true});
s.e=s.e.filter(e=>{e.x+=e.vx*dt;e.y+=e.vy*dt;return e.x>120});
x.fillStyle=`hsl(${hue},90%,55%)`;x.fillRect(0,90,24,240);x.fillStyle='#8a9bb0';x.fillRect(590,90,50,240);x.fillStyle='#fff';x.font='800 15px Poppins,sans-serif';x.textAlign='center';x.fillText('Logam',615,215);
s.p.forEach(p=>{x.fillStyle=`hsl(${hue},95%,58%)`;x.beginPath();x.arc(p.x,p.y,7,0,7);x.fill();x.fillRect(p.x-26,p.y-1.5,22,3)});
s.e.forEach(e=>{x.fillStyle='#1d6fe8';x.beginPath();x.arc(e.x,e.y,7,0,7);x.fill();x.fillStyle='#fff';x.fillRect(e.x-4,e.y-1,8,2)});
if(K<=0){x.fillStyle='#e5324f';x.font='800 18px Poppins,sans-serif';x.fillText('hf < φ : tidak ada elektron terlepas',400,60)}
return `hf = ${E.toFixed(2)} eV<br>K maks = ${Math.max(0,K).toFixed(2)} eV<br>f ambang = ${(v.w/4.1357).toFixed(2)}×10¹⁴ Hz`}},
digital:{t:'Gerbang logika',e:'Arus logika 1 digambarkan jalur oranye dengan titik berjalan; logika 0 jalur abu-abu. Lampu menyala jika keluaran Y = 1. Geser input A, B, dan jenis gerbang, lalu lengkapi tabel kebenaran sendiri.',c:[['a','Input A',0,1,1,0],['b','Input B',0,1,1,1],['g','Gerbang (0 AND · 1 OR · 2 XOR)',0,2,1,2]],
d(x,t,v){let a=v.a,b=v.b,g=v.g,y=g===0?a&b:g===1?a|b:a^b;
const W=(yy,on,x1,x2)=>{x.strokeStyle=on?'#ff9d00':'#9fb8d0';x.lineWidth=on?9:6;x.beginPath();x.moveTo(x1,yy);x.lineTo(x2,yy);x.stroke();if(on)for(let i=0;i<5;i++){let px=x1+((t*180+i*(x2-x1)/5)%(x2-x1));x.fillStyle='#fff';x.beginPath();x.arc(px,yy,4,0,7);x.fill()}};
W(160,a,90,330);W(260,b,90,330);W(210,y,490,650);
x.fillStyle='#12305a';x.beginPath();x.roundRect(330,110,160,200,40);x.fill();x.fillStyle='#fff';x.textAlign='center';x.font='900 36px Poppins,sans-serif';x.fillText(['AND','OR','XOR'][g],410,222);
[[160,a,'A'],[260,b,'B']].forEach(q=>{x.fillStyle=q[1]?'#ff9d00':'#9fb8d0';x.beginPath();x.arc(60,q[0],28,0,7);x.fill();x.fillStyle='#fff';x.font='800 20px Poppins,sans-serif';x.fillText(q[2]+'='+q[1],60,q[0]+7)});
x.shadowColor='#ffb700';x.shadowBlur=y?50:0;x.fillStyle=y?'#ffd75e':'#c5d6e6';x.beginPath();x.arc(710,210,42,0,7);x.fill();x.shadowBlur=0;x.fillStyle='#12305a';x.font='800 22px Poppins,sans-serif';x.fillText('Y='+y,710,218);
return `A = ${a} , B = ${b}<br>${['AND','OR','XOR'][g]} → Y = ${y}`}},
geo:{t:'Survei gravitasi di atas massa terkubur',e:'Sensor bergerak di permukaan mengukur tarikan gravitasi dari massa padat terkubur. Kurva oranye adalah anomali: puncak tepat di atas massa. Massa lebih besar → anomali tinggi; lebih dalam → anomali landai dan lebar. Skala vertikal diperbesar.',c:[['M','Massa sumber (10¹⁰ kg)',1,10,.5,5],['d','Kedalaman (m)',500,5000,100,1000]],
d(x,t,v){let G=6.674e-11,Mm=v.M*1e10,d=v.d,gz=X=>G*Mm*d/Math.pow(d*d+X*X,1.5),ref=G*5e10/1e6,r=14+Math.cbrt(v.M)*8,cy=190+d/30+r,sx=100+(t*110)%600,gv=gz((sx-400)*10);
x.fillStyle='#b98a5a';x.fillRect(0,190,800,230);x.fillStyle='#5fcf80';x.fillRect(0,184,800,8);
let gr=x.createRadialGradient(390,cy-6,2,400,cy,r);gr.addColorStop(0,'#8a5a30');gr.addColorStop(1,'#3d2412');x.fillStyle=gr;x.beginPath();x.arc(400,cy,r,0,7);x.fill();
x.strokeStyle='#cfe3f7';x.lineWidth=2;x.beginPath();x.moveTo(0,170);x.lineTo(800,170);x.stroke();
x.strokeStyle='#ff6b3d';x.lineWidth=4;x.beginPath();for(let p=0;p<=800;p+=4){let y=170-Math.min(145,gz((p-400)*10)/ref*40);p?x.lineTo(p,y):x.moveTo(p,y)}x.stroke();
let py=170-Math.min(145,gv/ref*40);x.setLineDash([5,5]);x.strokeStyle='#12305a';x.lineWidth=2;x.beginPath();x.moveTo(sx,py);x.lineTo(sx,184);x.stroke();x.setLineDash([]);
x.fillStyle='#ff6b3d';x.beginPath();x.arc(sx,py,8,0,7);x.fill();x.fillStyle='#12305a';x.fillRect(sx-14,170+14,28,14);x.fillRect(sx-3,184-2,6,8);
return `g anomali = ${(gv/1e-5).toFixed(3)} mGal<br>Puncak = ${(gz(0)/1e-5).toFixed(3)} mGal`}},
matfis:{t:'Deret Fourier membentuk gelombang persegi',e:'Setiap lingkaran adalah satu harmonik yang berputar (n = 1, 3, 5, …). Ujung rantai lingkaran digambar ke kanan sebagai gelombang. Makin banyak harmonik, bentuknya makin mendekati gelombang persegi (muncul juga overshoot Gibbs).',c:[['N','Jumlah harmonik',1,15,1,3],['f','Frekuensi (Hz)',.1,1,.05,.4],['A','Amplitudo',.5,3,.1,1.5]],
d(x,t,v,dt,s){if(!s.h)s.h=[];let th=6.283*v.f*t,px=150,py=210;
for(let k=0;k<v.N;k++){let n=2*k+1,r=v.A*50*4/(Math.PI*n);x.strokeStyle='#9bc9f0';x.lineWidth=2;x.beginPath();x.arc(px,py,r,0,7);x.stroke();let nx=px+r*Math.cos(n*th),ny=py-r*Math.sin(n*th);x.strokeStyle='#12305a';x.lineWidth=3;x.beginPath();x.moveTo(px,py);x.lineTo(nx,ny);x.stroke();px=nx;py=ny}
s.h.unshift(py);if(s.h.length>440)s.h.pop();
x.setLineDash([5,5]);x.strokeStyle='#cfe3f7';x.beginPath();x.moveTo(330,210-v.A*50);x.lineTo(780,210-v.A*50);x.moveTo(330,210+v.A*50);x.lineTo(780,210+v.A*50);x.stroke();x.strokeStyle='#ff6b3d';x.beginPath();x.moveTo(px,py);x.lineTo(330,py);x.stroke();x.setLineDash([]);
x.lineWidth=4;x.beginPath();s.h.forEach((y,i)=>i?x.lineTo(330+i,y):x.moveTo(330,y));x.stroke();x.fillStyle='#ff6b3d';x.beginPath();x.arc(px,py,7,0,7);x.fill();
return `Harmonik: 1, 3, …, ${2*v.N-1}<br>y(t) = ${((210-py)/50).toFixed(2)}`}},
komputasi:{t:'Metode Euler vs solusi eksak',e:'Garis biru adalah solusi eksak dy/dt = −ay. Titik oranye dihitung langkah demi langkah dengan metode Euler. Langkah h besar → galat besar, bahkan bisa berosilasi atau divergen jika a·h > 1. Perkecil h untuk mendekati solusi eksak.',c:[['y0','Nilai awal y₀',1,5,.5,4],['a','Konstanta a',.2,2,.1,.6],['h','Langkah h',.05,1.5,.05,.5]],
d(x,t,v){let X=u=>60+u*136,Y=y=>380-y*60,n=Math.round(5/v.h),sh=Math.min(n,Math.floor((t*6)%(n+8)));
x.strokeStyle='#cfe3f7';x.lineWidth=2;x.beginPath();x.moveTo(60,380);x.lineTo(740,380);x.moveTo(60,60);x.lineTo(60,380);x.stroke();
x.strokeStyle='#3ba3f6';x.lineWidth=4;x.beginPath();for(let i=0;i<=100;i++){let u=i*.05;i?x.lineTo(X(u),Y(v.y0*Math.exp(-v.a*u))):x.moveTo(X(u),Y(v.y0))}x.stroke();
let y=v.y0,pts=[[0,y]];for(let i=1;i<=sh;i++){y+=v.h*(-v.a*y);pts.push([i*v.h,y])}
x.strokeStyle='#ff6b3d';x.fillStyle='#ff6b3d';x.beginPath();pts.forEach((p,i)=>i?x.lineTo(X(p[0]),Y(p[1])):x.moveTo(X(p[0]),Y(p[1])));x.stroke();pts.forEach(p=>{x.beginPath();x.arc(X(p[0]),Y(p[1]),5,0,7);x.fill()});
x.font='800 15px Poppins,sans-serif';x.textAlign='left';x.fillStyle='#3ba3f6';x.fillText('● eksak',600,90);x.fillStyle='#ff6b3d';x.fillText('● Euler',600,115);
let te=n*v.h,ye=v.y0*Math.exp(-v.a*te),yu=v.y0*Math.pow(1-v.a*v.h,n);
return `t = ${te.toFixed(2)}<br>Euler = ${yu.toFixed(4)} ; eksak = ${ye.toFixed(4)}<br>Galat = ${Math.abs(yu-ye).toFixed(4)}`}}};
