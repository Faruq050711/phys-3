<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fisika Semester 3 — Ringkasan & Latihan Soal</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F8FB;--ink:#14213D;--mute:#56627F;--line:#D5DCEA;--card:#fff;--a:#2B59FF}
@media(prefers-color-scheme:dark){:root{--bg:#0E1626;--ink:#E8EDF8;--mute:#9DA9C6;--line:#26324D;--card:#152038}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.65 'Instrument Sans',system-ui,sans-serif}
header{padding:48px 16px 28px;background-image:linear-gradient(color-mix(in srgb,var(--line) 55%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--line) 55%,transparent) 1px,transparent 1px);background-size:28px 28px}
header>div,main{max-width:1000px;margin:auto}
h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;line-height:1.15}
h1{font-size:clamp(2.2rem,7vw,4rem);font-weight:800;margin:0 0 8px}
header p{margin:0;color:var(--mute);max-width:52ch}
nav{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow-x:auto;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
nav button{flex:none;border:1.5px solid var(--a);color:var(--a);background:none;border-radius:999px;padding:6px 14px;font:600 .9rem 'Instrument Sans',sans-serif;cursor:pointer}
nav button[aria-selected=true]{background:var(--a);color:#fff}
main{padding:24px 16px 56px}
h2{font-size:2rem;color:var(--a);margin:8px 0 4px}
h3{font-size:1.2rem;margin:28px 0 10px}
.lead{color:var(--mute);margin:0 0 20px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
@media(max-width:720px){.g{grid-template-columns:1fr}}
figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
figcaption{font-size:.85rem;color:var(--mute);margin-top:8px}
svg{width:100%;height:auto;color:var(--ink);stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg text{fill:currentColor;stroke:none;font:12px 'Instrument Sans',sans-serif}
.a{stroke:var(--a)}.f{fill:var(--a);fill-opacity:.22}.d{fill:var(--a);stroke:none}
ul{margin:0;padding-left:20px}li{margin-bottom:6px}
.fm code{display:inline-block;margin:3px 4px 3px 0;padding:3px 9px;border-radius:6px;font:600 .88rem ui-monospace,Menlo,monospace;background:color-mix(in srgb,var(--a) 13%,transparent)}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:10px}
summary{cursor:pointer;font-weight:600}
details[open] summary{color:var(--a)}
details p{margin:10px 0 0}
pre{background:#0F172A;color:#E2E8F0;padding:14px;border-radius:12px;overflow-x:auto;font:.85rem/1.5 ui-monospace,Menlo,monospace}
footer{padding:20px 16px;text-align:center;color:var(--mute);font-size:.85rem;border-top:1px solid var(--line)}
</style>
</head>
<body>
<svg style="position:absolute;width:0;height:0"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="context-stroke" stroke="none"/></marker></defs></svg>
<header><div>
<h1>Fisika Semester 3</h1>
<p>Ringkasan materi, ilustrasi, dan latihan soal untuk delapan mata kuliah. Pilih mata kuliah di bawah, lalu klik soal untuk melihat pembahasan.</p>
</div></header>
<nav id="tabs" aria-label="Mata kuliah"></nav>
<main id="app"></main>
<footer>Ringkasan belajar mandiri — cocokkan dengan silabus dan catatan dosen.</footer>
<script>

{id:'komfis',n:'Komputasi Fisika',w:'#0B7A5C',d:'Menyelesaikan masalah fisika dengan metode numerik dan Python.',

s:()=>{let e='',u='',y=1;for(let i=0;i<=40;i++)e+=(i?'L':'M')+(20+i*7)+' '+(170-Math.exp(i/20)*20)+' ';for(let i=0;i<=4;i++){u+=(i?'L':'M')+(20+i*70)+' '+(170-y*20)+' ';y*=1.5}return`<svg viewBox="0 0 320 190"><path d="M20 15V170H300"/><path d="${e}" opacity=".55"/><path class="a" stroke-dasharray="5 4" d="${u}"/></svg>`},
cap:'Kurva eksak y = eˣ (pudar) dan hampiran Euler dengan h = 0,5 (putus-putus).',
k:`def euler(f, y0, x0, x1, h):
    x, y = x0, y0
    while x &lt; x1 - 1e-12:
        y += h * f(x, y)
        x += h
    return y

def newton(f, df, x, tol=1e-10):
    while abs(f(x)) &gt; tol:
        x -= f(x) / df(x)
    return x

print(newton(lambda x: x*x - 2, lambda x: 2*x, 1))  # 1.41421356...`,
q:[['dy/dx = y, y(0) = 1. Dengan Euler h = 0,1, berapa y(0,2)?','y₁ = 1,1; y₂ = 1,1 + 0,11 = <b>1,21</b> (eksak 1,2214).'],['Satu iterasi Newton untuk f(x) = x² − 2 dari x₀ = 1.','x₁ = 1 − (−1)/2 = <b>1,5</b>.'],['Hitung ∫₀² x² dx dengan aturan trapesium, n = 2.','h = 1: (1/2)[0 + 2·1 + 4] = <b>3</b> (eksak 8/3 ≈ 2,67).']]},

q:[['Aorta berjari-jari 1,0 cm dengan v = 30 cm/s. Luas total kapiler 2000 cm². Berapa kecepatan darah di kapiler?','A₁ = π cm², jadi v₂ = π·30/2000 ≈ <b>0,047 cm/s</b>.'],['Intensitas bunyi 10⁻⁶ W/m². Berapa dB? (I₀ = 10⁻¹² W/m²)','β = 10 log(10⁶) = <b>60 dB</b>.'],['Potensial Nernst K⁺ pada 37 °C jika [K]luar = 5 mM dan [K]dalam = 140 mM.','E = 61,5 · log(5/140) ≈ <b>−89 mV</b>.']]},

{id:'digital',n:'Elektronika Digital',w:'#0C8599',d:'Logika biner, rangkaian kombinasional, dan rangkaian sekuensial.',

f:['A + A·B = A','(A·B)′ = A′ + B′','S = A ⊕ B','N flip-flop → maks 2ᴺ keadaan'],
s:`<svg viewBox="0 0 320 190"><path d="M15 55H140M90 55V135H140M15 75H140M60 75V155H140M210 65H250M210 145H250"/><rect class="a" x="140" y="40" width="70" height="50" rx="8"/><rect class="a" x="140" y="120" width="70" height="50" rx="8"/><circle class="d" cx="90" cy="55" r="3"/><circle class="d" cx="60" cy="75" r="3"/><text x="4" y="48">A</text><text x="4" y="92">B</text><text x="175" y="70" text-anchor="middle">XOR</text><text x="175" y="150" text-anchor="middle">AND</text><text x="256" y="69">S</text><text x="256" y="149">C</text></svg>`,

cap:'Penampang lapisan bumi (tidak berskala).',
q:[['Gelombang P (6 km/s) menempuh 120 km. Berapa waktunya?','t = 120/6 = <b>20 s</b>.'],['Berapa g pada ketinggian h = R dari permukaan bumi? (g₀ = 9,8 m/s²)','r = 2R, jadi g = g₀/4 = <b>2,45 m/s²</b>.'],['Selisih tiba S−P = 10 s, vₚ = 8 km/s, vₛ = 4 km/s. Berapa jarak sumber gempa?','d/4 − d/8 = 10, jadi d/8 = 10 → <b>80 km</b>.']]}
];
const tabs=document.getElementById('tabs'),app=document.getElementById('app');
C.forEach(c=>{const b=document.createElement('button');b.textContent=c.n;b.style.setProperty('--a',c.w);b.onclick=()=>{location.hash=c.id};tabs.append(b)});
function show(){
const i=Math.max(0,C.findIndex(c=>c.id==location.hash.slice(1))),c=C[i];
[...tabs.children].forEach((b,j)=>b.setAttribute('aria-selected',j==i));
app.style.setProperty('--a',c.w);
app.innerHTML=`<h2>${c.n}</h2><p class="lead">${c.d}</p>
<div class="g"><figure>${typeof c.s=='function'?c.s():c.s}<figcaption>${c.cap}</figcaption></figure>
<section><h3 style="margin-top:0">Ringkasan</h3><ul>${c.r.map(x=>`<li>${x}</li>`).join('')}</ul>
<h3>Rumus kunci</h3><div class="fm">${c.f.map(x=>`<code>${x}</code>`).join('')}</div></section></div>
${c.k?`<h3>Kode Python</h3><pre>${c.k}</pre><p class="lead">Versi lengkap dengan grafik ada di <code>python/latihan_komputasi.py</code>.</p>`:''}
<h3>Latihan soal</h3>${c.q.map((x,j)=>`<details><summary>${j+1}. ${x[0]}</summary><p>${x[1]}</p></details>`).join('')}`;
tabs.children[i].scrollIntoView({inline:'center',block:'nearest'});
}
addEventListener('hashchange',show);show();
</script>
